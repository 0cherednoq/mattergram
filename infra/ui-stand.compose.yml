# E5-03 owned UI stand. Layer over native-stand.compose.yml in the same project.
# Separate databases/data volumes preserve the 11.1 protocol baseline.
# Generate build/ui-tls/ca.pem with tools.ui_stand tls before enabling this profile.
services:
  db_ui:
    profiles: [ui]
    image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    environment:
      POSTGRES_USER: mattergram
      POSTGRES_PASSWORD: ${MATTERGRAM_STAND_DB_PASSWORD:?Generate build/native-stand.env first}
      POSTGRES_DB: mattergram_ui
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mattergram -d mattergram_ui']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ui-postgres-data:/var/lib/postgresql/data
  mattermost_ui:
    profiles: [ui]
    image: mattermost/mattermost-team-edition:12.0.2@sha256:08c0b4b93a14196b0850f62faa4a437d2643533f009cac4868a0b793aad61fc3
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db_ui:
        condition: service_healthy
    environment:
      SSL_CERT_FILE: /mattergram-ui-trust/ca.pem
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattergram:${MATTERGRAM_STAND_DB_PASSWORD}@db_ui:5432/mattergram_ui?sslmode=disable
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: 'true'
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: 'true'
      MM_SERVICESETTINGS_ENABLECOMMANDS: 'true'
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: host.docker.internal
      MM_SERVICESETTINGS_ENABLEEMAILINVITATIONS: 'false'
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: 'false'
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: 'false'
      MM_LOGSETTINGS_CONSOLELEVEL: ERROR
      MM_LOGSETTINGS_ENABLEFILE: 'false'
      # Owned browser fixture: required for installing the repository's UI plugin.
      MM_PLUGINSETTINGS_ENABLEUPLOADS: 'true'
    ports:
      - '127.0.0.1::8065'
    volumes:
      - ui-mattermost-data:/mattermost/data
      - ../build/ui-tls/ca.pem:/mattergram-ui-trust/ca.pem:ro
volumes:
  ui-postgres-data:
  ui-mattermost-data:
