# Simulation scaffold. Add fault-injection scenarios under each mock, e.g.:
#   scenarios:
#     - overrides:
#         conditions:
#           latency: { delay_ms: 500 }
# Then serve it with: postman simulation run <this file>

simulation: mattergram-native
routing: path
mocks:
  - name: mattermost-native
    routeKey: mattermost
    path: postman/mocks/mattermost
  - name: mattermost-bootstrap
    routeKey: bootstrap
    path: postman/mocks/bootstrap
