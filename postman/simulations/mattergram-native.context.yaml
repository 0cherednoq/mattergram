  - id: explicit-setup-native-operations
    status: supported
    claim: The owned Mattermost 12.0.2 accepts the explicit SetupClient bot/token/team/private-channel/membership/command operations in the recorded scenario, with a separate runtime credential.
    reason: SDK operations ran against the native server; the ordinary actor executed the command and read the runtime bot post. The provider response, not a mock, establishes these shapes and statuses.
    verification: On 2026-11-12 tools.verify_setup_stand created a bot and PAT (HTTP 200), team and private channel, added four memberships, created/read/updated/listed the command, and preserved its integration token on update. Callback reached SDK and a runtime-token post was read by an ordinary actor. An ordinary setup identity entered the client but create_bot returned 403; revoked runtime token returned 401 without fallback. Owned command/token cleaned, team/channel archived and bot disabled. This is explicit operations, not durable Bootstrap or reconciliation.
    source: tools/verify_setup_stand.py; build/reports/setup-stand.json; manifests/provisioning-profile.json
    updated_at: '2026-11-12'
  - id: lost-setup-write-response
    status: unknown
    claim: A particular lost POST/PUT/DELETE response against the real provider may follow a committed mutation.
    reason: Real-provider response loss was not injected. The local authored mock demonstrates caller uncertainty and no-retry behavior under a committed-write model only.
    verification: On 2026-11-12 tools.verify_setup_simulation observed one committed creation/update/deletion before each timeout, RequestOutcomeUnknown and exactly one write attempt. Independent mock state showed the creation, changed hint and deletion. Separate 403/429/302 made one attempt with no write/redirect. CLI log confirmed 13 command requests (7 POST, 2 GET, 2 PUT, 2 DELETE). Prior REST/response_url/form simulations passed with the shared transport. Local aiohttp tests additionally cover PATCH, disconnect, cancellation, malformed successful writes and independent credential/pool lifecycle.
    source: tools/verify_setup_simulation.py; tests/integration/test_setup_http.py; postman/mocks/mattermost/handler.js; build/reports/setup-simulation.json; build/reports/setup-simulation-cli.ndjson; build/reports/setup-simulation-log-check.json
    updated_at: '2026-11-12'
  - id: automatic-bootstrap-native-reconciliation
    status: supported
    claim: The owned Mattermost 12.0.2 accepts the automatic bot, token, team, private-channel, membership and multi-team command reconciliation used by Bootstrap in the recorded deployment scenario.
    reason: The SDK ran against the native server, repeated the same manifest without duplicate resources, updated command metadata, then served callbacks and runtime posts with non-administrative credentials.
    verification: On 2026-11-12 tools.verify_bootstrap_stand recorded 18 created/2 reused on the first run, 20 reused on the identical run and 4 updated/18 reused after a manifest change. Two teams, two private channels and four commands retained their native IDs and bot/command tokens. Four commands reached the SDK and four runtime posts were read by an ordinary actor. Only owned fixtures were cleaned. Callback reachability during the run does not establish deployment readiness before the listener is serving.
    source: tools/verify_bootstrap_stand.py; build/reports/bootstrap-stand.json; docs/reports/bootstrap.json; manifests/provisioning-profile.json
    updated_at: '2026-11-12'
  - id: bootstrap-write-fault-outcome
    status: unknown
    claim: A timed-out Bootstrap write against the real provider may have committed before its response was lost.
    reason: The real-provider run did not inject response loss. The authored local stand-in establishes SDK journaling, no blind retry and explicit recovery behavior under that model, not Mattermost provider fault behavior.
    verification: On 2026-11-12 tools.verify_bootstrap_simulation checked 437 request events. A conclusive 403 aborted cleanly and allowed a corrected retry; a write-then-timeout remained indeterminate and blocked automatic retry; explicit recovery by native ID avoided duplication. The run also covered foreign triggers, feature/config allowlists, least-privileged success/denial, runtime without setup credential and two Bootstrap instances serialized by their shared OS lock.
    source: tools/verify_bootstrap_simulation.py; postman/mocks/bootstrap/handler.js; build/reports/bootstrap-simulation.json; build/reports/bootstrap-simulation-cli.ndjson; build/reports/bootstrap-simulation-log-check.json; docs/reports/bootstrap.json
    updated_at: '2026-11-12'

