simulation: "mattergram-native"
generated: "2026-11-12"

# What this simulation stands in for and what work it unblocks. Both need
# hindsight, so they are the last thing to write. The members it serves, their
# route keys and the hosts they answer for are in the .sim.yaml beside this file.
purpose:
  stands_in_for: The initial Mattermost REST slice, dialog open, command CRUD, response_url and Bootstrap resource boundaries; not the full server.
  unblocks: Real runtime/setup SDK HTTP serialization, error mapping, Bootstrap reconciliation and post-write timeout checks without production credentials.

# What the code relies on about a dependency's behaviour — one claim per entry,
# each { id, status, claim, reason, verification, source, updated_at }.
#
#   status        supported     evidence supports it, within a stated scope
#                 contradicted  evidence gives a counterexample
#                 unknown       available evidence cannot establish or reject it
#                 conflicting   applicable sources disagree
#
#   reason        why the evidence adds up to that status
#   verification  what was checked and what it showed — a contract read, a
#                 request made and its response, a handler inspected. Name what
#                 is still planned or blocked, and what has gone stale and why.
#   source        where to go to re-check it: a file and line range, a run, a
#                 published contract. A claim with nothing to point at is
#                 `unknown`.
#   updated_at    the day this entry was last written, YYYY-MM-DD. Set it when
#                 you add a claim and again whenever you change one, so a claim
#                 nobody has touched in months is visible as such.
#
# A claim is about the dependency, not about the simulation — what the caller
# is taken to be, which plan or permission is assumed, the order calls go in,
# what gets retried, the shape of the data.
#
#   - id: charges-idempotent-for-24h
#     status: supported
#     claim: Payments treats a repeated Idempotency-Key as the same charge for
#       24 hours. Beyond that it is a new charge.
#     reason: The contract guarantees it for that window, and a run inside the
#       window agreed. The 24-hour boundary itself is untested.
#     verification: Read the provider's API reference for POST /charges, then
#       sent the same key twice 10 minutes apart and got the first charge id
#       back both times.
#     source: the provider's API reference for POST /charges; runs/idempotency-001
#     updated_at: "2026-11-12"
assumptions:
  - id: bearer-identity-and-channel-post
    status: supported
    claim: The pinned Mattermost 11.1.0 stand accepts its issued bot token as Bearer auth for users/me and channel post creation.
    reason: Both the pinned API contract and a real owned server run agree for these two operations.
    verification: On 2026-11-12 native client got bot identity, created a post, and the harness read the post back through a separate administrative HTTP request. The captured own posted WS event was ignored by the normalizer. Router/Dispatcher is not part of this result.
    source: contracts/native-rest.openapi.json; upstream.lock.json; tools/verify_native_stand.py; build/reports/native-stand.json
    updated_at: '2026-11-12'
  - id: thread-root-is-native-post-id
    status: supported
    claim: On the pinned stand, root_id identifies the thread root; nested replies retain the original root rather than the immediate parent's ID.
    reason: The createPost contract and real stand's reply/root fields agree in the scenario run.
    verification: A top-level answer had no root; reply and nested reply returned the original human post ID as root_id. Local Postman simulation also recorded the expected root in its state.
    source: tools/verify_native_stand.py; tools/verify_native_simulation.py; build/reports/native-stand.json; build/reports/native-simulation.json
    updated_at: '2026-11-12'
  - id: timeout-does-not-prove-no-write
    status: unknown
    claim: A particular timed-out createPost against the real provider may have committed before the response was lost.
    reason: The caller cannot infer server commit state from a missing response; this run did not inject faults into the real server.
    verification: Authored local Postman mock committed one post and delayed its response. SDK returned RequestOutcomeUnknown and the mock state/log showed one POST attempt, with no retry. This demonstrates caller behavior under that model, not a measured real-provider timeout outcome.
    source: postman/mocks/mattermost/handler.js; tools/verify_native_simulation.py; tests/integration/test_native_http.py; build/reports/native-simulation.json
    updated_at: '2026-11-12'
  - id: owner-mock-search
    status: unknown
    claim: An owner-published Postman mock for this exact pinned provider version exists.
    reason: CLI is a guest session; signed-in owner/workspace search was skipped. The local mock was authored from the checked-in minimal contract.
    verification: postman status reported guest mode on 2026-11-12. No cloud resource was searched, pushed or deployed.
    source: contracts/native-rest.openapi.json; postman/mocks/mattermost/config.yaml
    updated_at: '2026-11-12'
  - id: command-response-capability-acceptance
    status: supported
    claim: On the owned pinned 11.1.0 stand, an actual slash response_url accepts SDK in_channel followups without a Bot Bearer header.
    reason: The real server accepted the issued command hook and the harness read the resulting posts back through a separate control client.
    verification: On 2026-11-12 tools.verify_http_stand exercised initial slash response, explicit defer/followup and five real hook writes. The sixth SDK attempt was blocked locally. No claim about measured server-side sixth-call rejection or the complete 30-minute interval.
    source: tools/verify_http_stand.py; build/reports/http-stand.json; docs/reports/http-core.json
    updated_at: '2026-11-12'
  - id: delayed-response-fault-outcome
    status: unknown
    claim: A particular timed-out response_url request may already have produced a real-provider post.
    reason: Local injection demonstrates caller behavior but did not inject a lost response into Mattermost itself.
    verification: The E4 local run recorded one delayed response before withholding the reply for 1500ms. SDK raised RequestOutcomeUnknown after 1000ms and did not retry. Separate 401/403/429/302 cases each showed one call and no write; Retry-After was retained. Five sequential sends had no Authorization or Cookie header and a sixth SDK attempt made no HTTP call. An earlier concurrent probe exposed read/modify/write races in the authored mock's pm.state list; evidence uses sequential calls here, while SDK concurrency is covered by local aiohttp tests.
    source: tools/verify_http_simulation.py; postman/mocks/mattermost/handler.js; build/reports/http-simulation.json; build/reports/http-simulation-cli.ndjson; tests/integration/test_http_ingress.py
    updated_at: '2026-11-12'
  - id: post-action-11-1-response-shape
    status: supported
    claim: The pinned Mattermost 11.1 response model has update, ephemeral_text and skip_slack_parsing; SDK baseline rejects post-action goto_location and inline error fields.
    reason: Version-pinned model source determines this baseline. Newer web documentation describes a wider shape and is not sufficient evidence for 11.1 support.
    verification: Read integration_action.go at e62f350cd7a896c45a0e025f44cb8915f5597854. Real post-action ACK, update/read-back and ephemeral actor WS event passed. Unsupported navigation raised locally and the explicit app error observer responded ephemerally; unsupported wire navigation was not sent to the server.
    source: manifests/http-profile.json; src/mattergram/http/responses.py; tools/verify_http_stand.py; build/reports/http-stand.json
    updated_at: '2026-11-12'
  - id: compiled-legacy-ui-post
    status: supported
    claim: The pinned 11.1.0 stand accepts the SDK rich attachment shape and dispatches SDK-compiled signed native button/select actions.
    reason: Actual runtime Bot.send_message created the attachment and real post action requests reached the SDK normalizer through Mattermost. This establishes API/transport acceptance, not client rendering.
    verification: On 2026-11-12 tools.verify_http_stand ran again with Attachment/Actions/External/ActionContext and the common compiler. ACK/update/selected_option/repeated presses/ephemeral actor WS and tamper rejection passed. Local Postman simulation separately preserved the actual SDK-created action props in mock state; its 401/403/429/timeout/no-retry cases still passed. The mock validates only the modeled request boundary; it is not a complete UI renderer or full provider schema validator.
    source: tools/verify_http_stand.py; build/reports/http-stand.json; tools/verify_native_simulation.py; build/reports/native-simulation.json; build/reports/ui-simulation-cli.ndjson
    updated_at: '2026-11-12'

