    status: unknown
    claim: A particular timed-out real open_dialog request may already have published an actor form event.
    reason: Pinned provider source publishes before returning status, but this run did not inject a lost response into the real server. Local fault injection establishes SDK behavior only.
    verification: Postman mock recorded one native open, withheld its response for 1500ms, and the SDK timed out at 1000ms without retry. The session became indeterminate and a subsequent submit was blocked before business dispatch. Separate 403/429/302 cases each made one write attempt and followed no redirect. Existing REST/response_url simulations also passed again.
    source: postman/mocks/mattermost/handler.js; tools/verify_form_simulation.py; build/reports/form-simulation.json; build/reports/forms-simulation-cli.ndjson; manifests/forms-profile.json
